      - name: Run All Python AI Scripts
        env:
          # 🌟 这里建议把两个 Key 都填上，防止脚本报错
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Preparing output folders..."
          mkdir -p content/post
          mkdir -p stock_cache

          # 依次运行四个脚本
          echo "1. Running auto_post.py..."
          python auto_post.py
          
          echo "2. Running lianhong.py..."
          python lianhong.py
          
          echo "3. Running www.py..."
          python www.py
          
          echo "4. Running yidong.py..."
          python yidong.py

          echo "All scripts finished."

      - name: Commit all generated reports and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 先把生成的所有新文件存到临时目录，防止被 reset 弄丢
          rm -rf /tmp/all_generated
          mkdir -p /tmp/all_generated/post
          mkdir -p /tmp/all_generated/stock_cache
          
          # 拷贝 content/post 下所有 md 文件（包括 report- 和 radar-）
          cp content/post/*.md /tmp/all_generated/post/ 2>/dev/null || true
          if [ -d "stock_cache" ]; then
            cp -a stock_cache/. /tmp/all_generated/stock_cache/ 2>/dev/null || true
          fi

          # 2. 拉取远程最新状态，防止冲突
          echo "Syncing latest remote branch..."
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          # 3. 将刚才生成的那些文件还原回来
          mkdir -p content/post
          mkdir -p stock_cache
          cp /tmp/all_generated/post/*.md content/post/ 2>/dev/null || true
          cp -a /tmp/all_generated/stock_cache/. stock_cache/ 2>/dev/null || true

          # 4. 提交并推送
          git status --short
          if [ -n "$(git status --porcelain -- content/post stock_cache)" ]; then
            git add content/post stock_cache
            git commit -m "🤖 AI 自动更新多维复盘报告 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes detected, skipping commit."
          fi
