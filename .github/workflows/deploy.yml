name: Build and deploy

on:
  push:
    branches:
      - main
      - master
      - Indent2
  workflow_dispatch:
  schedule:
    # 每天北京时间 15:35 运行 (UTC 07:35)
    - cron: '35 7 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DART_SASS_VERSION: 1.97.1
      GO_VERSION: 1.25.5
      HUGO_VERSION: 0.161.1
      NODE_VERSION: 24.12.0
      TZ: Asia/Shanghai
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_MODEL: gemini-2.0-flash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore stock cache
        uses: actions/cache@v4
        with:
          path: stock_cache
          key: stock-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            stock-cache-${{ runner.os }}-${{ github.ref_name }}-
            stock-cache-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas akshare

      - name: Configure Git
        run: |
          git config core.quotepath false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run All Python AI Scripts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Preparing output folders..."
          mkdir -p content/post
          mkdir -p stock_cache

          # echo "1. Running auto_post.py..."
          # python auto_post.py || echo "auto_post.py failed"
          
          echo "2. Running lianhong.py..."
          python lianhong.py || echo "lianhong.py failed"
          
          echo "3. Running www.py..."
          python www.py || echo "www.py failed"
          
          #echo "4. Running yidong.py..."
          #python yidong.py || echo "yidong.py failed"

          echo "4. Running duotouxushi.py..."
          python duotouxushi.py || echo "duotouxushi.py failed"

      - name: Commit all generated reports and cache
        run: |
          # 1. 备份生成的所有新文件
          rm -rf /tmp/all_generated
          mkdir -p /tmp/all_generated/post
          mkdir -p /tmp/all_generated/stock_cache
          
          cp content/post/*.md /tmp/all_generated/post/ 2>/dev/null || true
          if [ -d "stock_cache" ]; then
            cp -a stock_cache/. /tmp/all_generated/stock_cache/ 2>/dev/null || true
          fi

          # 2. 同步远程最新状态，防止 Push 冲突
          echo "Syncing latest remote branch..."
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          # 3. 还原生成的文件
          mkdir -p content/post
          mkdir -p stock_cache
          cp /tmp/all_generated/post/*.md content/post/ 2>/dev/null || true
          cp -a /tmp/all_generated/stock_cache/. stock_cache/ 2>/dev/null || true

          # 4. 提交并推送
          if [ -n "$(git status --porcelain -- content/post stock_cache)" ]; then
            git add content/post stock_cache
            git commit -m "🤖 AI 自动更新多维复盘报告 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes detected, skipping commit."
          fi

      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://indent1.github.io/indent2/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
